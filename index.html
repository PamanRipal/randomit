<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Roda Keputusan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #150f30;
    --bg-2: #1e1650;
    --surface: #241b57;
    --surface-2: #2c2166;
    --line: #3b2f80;
    --text: #f3efff;
    --muted: #a79cd9;
    --coral: #ff6b5b;
    --marigold: #ffb84d;
    --teal: #2ec4b6;
    --violet: #8b7bff;
    --pink: #ff5d9e;
    --lime: #c6e356;
    --gold: #ffd166;
    color-scheme: dark;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ height:100%; margin:0; overscroll-behavior: none; }
  body{
    background:
      radial-gradient(60vw 40vw at 85% -5%, rgba(255,107,91,0.18), transparent 60%),
      radial-gradient(50vw 40vw at 0% 100%, rgba(46,196,182,0.14), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  .app{
    height: 100vh;
    height: 100dvh;
    display:flex;
    flex-direction: column;
    padding: max(12px, env(safe-area-inset-top,0px)) 16px max(12px, env(safe-area-inset-bottom,0px));
    overflow: hidden;
  }

  /* --- top bar --- */
  .topbar{
    flex: 0 0 auto;
    display:flex;
    flex-direction: column;
    gap: 10px;
    padding-bottom: 10px;
  }
  .brand{
    font-family:'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: clamp(22px, 6vw, 30px);
    text-align:center;
  }
  .templates{
    display:flex;
    gap: 8px;
    overflow-x: auto;
    overflow-y: hidden;
    padding: 2px 2px 6px;
    scrollbar-width: thin;
    -webkit-overflow-scrolling: touch;
  }
  .templates::-webkit-scrollbar{ height: 4px; }
  .templates::-webkit-scrollbar-thumb{ background: var(--line); border-radius: 4px; }
  .chip{
    flex: 0 0 auto;
    font-family:'Inter', sans-serif;
    font-weight:700;
    font-size: clamp(14px, 3.6vw, 16px);
    color: var(--text);
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 10px 18px;
    cursor:pointer;
    white-space: nowrap;
  }
  .chip.active{
    background: var(--pink);
    border-color: var(--pink);
    color: #1a1130;
  }
  .chip:hover:not(.active){ border-color: var(--pink); }

  /* --- stage / wheel --- */
  .stage{
    flex: 1 1 auto;
    min-height: 0;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .wheel-card{
    position: relative;
    height: 100%;
    max-height: 100%;
    width: 100%;
    display:flex;
    flex-direction: column;
    align-items:center;
    justify-content:center;
    gap: clamp(14px, 3vh, 26px);
  }
  .edit-fab{
    position:absolute;
    top: 4px;
    right: 4px;
    z-index: 5;
    display:flex;
    align-items:center;
    gap: 6px;
    font-family:'Inter', sans-serif;
    font-weight: 700;
    font-size: clamp(13px, 3.2vw, 15px);
    color: var(--text);
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 9px 16px;
    cursor: pointer;
  }
  .edit-fab:hover{ border-color: var(--pink); }
  .wheel-holder{
    position: relative;
    flex: 0 0 auto;
    width: 260px;
    height: 260px;
  }
  canvas{
    width:100%;
    height:100%;
    display:block;
    filter: drop-shadow(0 18px 30px rgba(0,0,0,0.45));
  }
  .pointer{
    position:absolute;
    top: -6px;
    left: 50%;
    transform: translateX(-50%);
    width: 9%;
    z-index: 3;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
  }
  .hub{
    position:absolute;
    top:50%; left:50%;
    width: 15%; height:15%;
    transform: translate(-50%,-50%);
    background: radial-gradient(circle at 35% 30%, #fff, var(--gold) 55%, #c98f1c 100%);
    border-radius: 50%;
    border: 3px solid var(--bg);
    z-index: 2;
  }
  .spin-btn{
    flex: 0 0 auto;
    font-family:'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: clamp(20px, 5.5vw, 26px);
    color: #1a1130;
    background: linear-gradient(180deg, var(--gold), var(--marigold));
    border: none;
    border-radius: 999px;
    padding: clamp(12px,2.4vh,16px) clamp(38px,10vw,58px);
    cursor: pointer;
    box-shadow: 0 8px 0 #b5710f, 0 14px 22px rgba(0,0,0,0.35);
    transition: transform .08s ease;
    letter-spacing: .01em;
  }
  .spin-btn:active{ transform: translateY(4px); box-shadow: 0 4px 0 #b5710f, 0 8px 14px rgba(0,0,0,0.3); }
  .spin-btn:disabled{ opacity: .55; cursor: default; box-shadow: 0 8px 0 #6c5a2a; }

  /* --- edit sheet --- */
  .sheet-overlay{
    position: fixed;
    inset: 0;
    background: rgba(8,5,22,0.6);
    backdrop-filter: blur(2px);
    display:flex;
    align-items:flex-end;
    justify-content:center;
    z-index: 50;
    opacity:0;
    pointer-events:none;
    transition: opacity .2s ease;
  }
  .sheet-overlay.open{ opacity:1; pointer-events:auto; }
  .sheet{
    width:100%;
    max-width: 560px;
    max-height: 86dvh;
    background: linear-gradient(180deg, var(--surface), var(--bg-2));
    border: 1px solid var(--line);
    border-bottom: none;
    border-radius: 26px 26px 0 0;
    padding: 18px 20px max(18px, env(safe-area-inset-bottom,0px));
    display:flex;
    flex-direction: column;
    transform: translateY(100%);
    transition: transform .25s ease;
  }
  .sheet-overlay.open .sheet{ transform: translateY(0); }
  .sheet-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom: 4px;
  }
  .sheet-header h2{
    font-family:'Baloo 2', sans-serif;
    font-size: clamp(20px,5vw,24px);
    margin:0;
  }
  .sheet-header button{
    background: var(--surface-2);
    border: 1px solid var(--line);
    color: var(--text);
    width: 36px; height:36px;
    border-radius: 50%;
    font-size: 20px;
    cursor:pointer;
    line-height:1;
  }
  .sub{
    color: var(--muted);
    font-size: clamp(13px,3.4vw,15px);
    margin: 4px 0 14px;
  }
  .items{
    display:flex;
    flex-direction:column;
    gap: 9px;
    margin-bottom: 14px;
    overflow-y: auto;
    padding-right: 2px;
  }
  .item-row{
    display:flex;
    align-items:center;
    gap: 10px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 4px 6px 4px 14px;
    flex: 0 0 auto;
  }
  .item-row .dot{
    width: 12px; height:12px; border-radius:50%; flex:none;
  }
  .item-row input{
    flex:1;
    background: transparent;
    border: none;
    color: var(--text);
    font-size: clamp(15px,4vw,17px);
    font-family: 'Inter', sans-serif;
    padding: 10px 0;
    min-width: 0;
  }
  .item-row input:focus{ outline: none; }
  .item-row button{
    flex:none;
    width: 34px; height:34px;
    border-radius: 8px;
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 19px;
    cursor:pointer;
    line-height:1;
  }
  .item-row button:hover{ background: rgba(255,93,158,0.18); color: var(--pink); }

  .add-row{
    display:flex;
    gap: 8px;
    margin-top: 2px;
    flex: 0 0 auto;
  }
  .add-row input{
    flex:1;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 12px;
    color: var(--text);
    font-size: clamp(15px,4vw,17px);
    padding: 12px 14px;
    font-family:'Inter', sans-serif;
  }
  .add-row input::placeholder{ color: var(--muted); }
  .add-row input:focus{ outline: 2px solid var(--pink); outline-offset: 1px; }
  .add-row button{
    flex:none;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size: clamp(15px,4vw,17px);
    background: var(--teal);
    color:#0d2a27;
    border:none;
    border-radius: 12px;
    padding: 0 22px;
    cursor:pointer;
  }
  .foot-actions{
    display:flex;
    justify-content: space-between;
    align-items:center;
    margin-top: 14px;
    font-size: clamp(12px,3.2vw,14px);
    color: var(--muted);
    flex: 0 0 auto;
  }
  .foot-actions button{
    background:none;
    border:none;
    color: var(--muted);
    text-decoration: underline;
    cursor:pointer;
    font-size: inherit;
    font-family:'Inter', sans-serif;
    padding: 0;
  }
  .foot-actions button:hover{ color: var(--pink); }

  /* --- big result overlay --- */
  .result-overlay{
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at 50% 40%, rgba(46,25,110,0.97), rgba(10,7,26,0.99));
    display:flex;
    align-items:center;
    justify-content:center;
    z-index: 100;
    opacity:0;
    pointer-events:none;
    transition: opacity .25s ease;
    padding: 24px;
  }
  .result-overlay.open{ opacity:1; pointer-events:auto; }
  .result-content{
    text-align:center;
    max-width: 92vw;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap: clamp(16px,3vh,28px);
  }
  .result-label{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    color: var(--marigold);
    font-size: clamp(18px, 4vw, 26px);
    letter-spacing: .02em;
  }
  .result-value{
    font-family:'Baloo 2', sans-serif;
    font-weight: 800;
    color: var(--lime);
    font-size: clamp(38px, 11vw, 96px);
    line-height: 1.08;
    word-break: break-word;
    transform: scale(.85);
    opacity:0;
    transition: transform .35s cubic-bezier(.2,1.4,.4,1), opacity .3s ease;
  }
  .result-overlay.open .result-value{ transform: scale(1); opacity:1; }
  .close-result{
    font-family:'Inter', sans-serif;
    font-weight:700;
    font-size: clamp(15px,4vw,18px);
    color: var(--text);
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 12px 28px;
    cursor:pointer;
  }
  .close-result:hover{ border-color: var(--pink); }

  @media (prefers-reduced-motion: reduce){
    .result-value, .sheet, .sheet-overlay, .result-overlay{ transition:none; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">🎡 Roda Keputusan</div>
    <div class="templates" id="templates"></div>
  </div>

  <div class="stage">
    <div class="wheel-card">
      <button class="edit-fab" id="editBtn">✏️ Edit isi</button>
      <div class="wheel-holder" id="wheelHolder">
        <svg class="pointer" viewBox="0 0 34 40" xmlns="http://www.w3.org/2000/svg">
          <path d="M17 40 L2 8 Q17 -6 32 8 Z" fill="#ff5d9e" stroke="#150f30" stroke-width="2"/>
        </svg>
        <canvas id="wheel" width="640" height="640"></canvas>
        <div class="hub"></div>
      </div>
      <button class="spin-btn" id="spinBtn">Putar!</button>
    </div>
  </div>
</div>

<!-- edit sheet -->
<div class="sheet-overlay" id="editOverlay">
  <div class="sheet">
    <div class="sheet-header">
      <h2>Edit isi roulette</h2>
      <button id="closeEdit" aria-label="Tutup">×</button>
    </div>
    <p class="sub" id="itemCount"></p>
    <div class="items" id="items"></div>
    <div class="add-row">
      <input type="text" id="newItem" placeholder="Tambah pilihan baru…" maxlength="60">
      <button id="addBtn">Tambah</button>
    </div>
    <div class="foot-actions">
      <span id="warnMsg"></span>
      <button id="clearBtn">Hapus semua</button>
    </div>
  </div>
</div>

<!-- big result -->
<div class="result-overlay" id="resultOverlay">
  <div class="result-content">
    <div class="result-label">Hasilnya…</div>
    <div class="result-value" id="resultValue"></div>
    <button class="close-result" id="closeResult">Tutup</button>
  </div>
</div>

<script>
  const COLORS = ['#ff6b5b','#ffb84d','#2ec4b6','#8b7bff','#ff5d9e','#c6e356'];

  const TEMPLATES = {
    abcd: {
      label: 'A / B / C / D',
      items: ['A','B','C','D']
    },
    topik: {
      label: 'Topik obrolan',
      items: ['Cerita paling lucu minggu ini','Rencana liburan impian','Film/series yang lagi ditonton','Gosip terbaru','Rencana weekend','Hal yang bikin bersyukur hari ini']
    },
    cerita: {
      label: 'Cerita',
      items: ['Cerita seram','Cerita lucu','Cerita film / buku','Cerita momen berkesan','Cerita cinta']
    },
    kenalan: {
      label: 'Kenalan',
      items: ['Hobi','Impian','Lagu favorit','Makanan favorit','Love Language']
    },
    kenalan2: {
      label: 'Kenalan 2',
      items: ['Apa yang membuatmu marah?','Apa yang membuatmu sedih?','Apa yang membuatmu bahagia?','Apa yang paling kamu takutin?','Apa yang bikin kamu kagum?']
    },
    tod: {
      label: 'Truth or Dare',
      items: ['Truth','Dare']
    },
    truth: {
      label: 'Truth',
      items: ['Rahasia yang belum pernah kamu certain ke siapa pun?','Siapa crush pertamamu?','Momen paling memalukan dalam hidupmu?','Kebohongan terbesar yang pernah kamu buat?','Hal yang paling kamu sesali?','Chat siapa yang paling sering kamu stalking?']
    },
    dare: {
      label: 'Dare',
      items: ['Minta IG ke orang random di sekitar','Post story video bilang aku cantik / aku ganteng selama 30 detik di media sosial','Push up / Sit up / Squat 10x','Chat orang yang ada di kontak secara acak bilang "Aku kangen"','Tiruin gaya orang / tokoh / karakter sampai ada yang berhasil nebak','Nyanyi / joget minimal 30 detik']
    }
  };

  let activeTemplate = 'abcd';
  let items = [...TEMPLATES.abcd.items];
  let rotation = 0;
  let spinning = false;

  const canvas = document.getElementById('wheel');
  const ctx = canvas.getContext('2d');
  const templatesEl = document.getElementById('templates');
  const itemsEl = document.getElementById('items');
  const itemCountEl = document.getElementById('itemCount');
  const warnMsg = document.getElementById('warnMsg');
  const spinBtn = document.getElementById('spinBtn');
  const editBtn = document.getElementById('editBtn');
  const editOverlay = document.getElementById('editOverlay');
  const closeEdit = document.getElementById('closeEdit');
  const resultOverlay = document.getElementById('resultOverlay');
  const resultValue = document.getElementById('resultValue');
  const closeResult = document.getElementById('closeResult');

  const stageEl = document.querySelector('.stage');
  const wheelCardEl = document.querySelector('.wheel-card');
  const wheelHolderEl = document.getElementById('wheelHolder');

  function sizeWheelHolder(){
    const cardGap = parseFloat(getComputedStyle(wheelCardEl).gap) || 0;
    const availH = stageEl.clientHeight - editBtn.offsetHeight * 0 - spinBtn.offsetHeight - cardGap - 8;
    const availW = stageEl.clientWidth - 8;
    const size = Math.max(140, Math.floor(Math.min(availH, availW)));
    wheelHolderEl.style.width = size + 'px';
    wheelHolderEl.style.height = size + 'px';
  }

  function renderTemplates(){
    templatesEl.innerHTML = '';
    Object.entries(TEMPLATES).forEach(([key, tpl]) => {
      const btn = document.createElement('button');
      btn.className = 'chip' + (key === activeTemplate ? ' active' : '');
      btn.textContent = tpl.label;
      btn.onclick = () => {
        activeTemplate = key;
        items = [...tpl.items];
        renderTemplates();
        renderItems();
        drawWheel();
      };
      templatesEl.appendChild(btn);
    });
  }

  function renderItems(){
    itemsEl.innerHTML = '';
    items.forEach((val, i) => {
      const row = document.createElement('div');
      row.className = 'item-row';

      const dot = document.createElement('span');
      dot.className = 'dot';
      dot.style.background = COLORS[i % COLORS.length];

      const input = document.createElement('input');
      input.type = 'text';
      input.value = val;
      input.maxLength = 60;
      input.oninput = () => { items[i] = input.value; drawWheel(); refreshItemCount(); };

      const removeBtn = document.createElement('button');
      removeBtn.textContent = '×';
      removeBtn.title = 'Hapus';
      removeBtn.onclick = () => {
        items.splice(i, 1);
        renderItems();
        drawWheel();
      };

      row.appendChild(dot);
      row.appendChild(input);
      row.appendChild(removeBtn);
      itemsEl.appendChild(row);
    });
    refreshItemCount();
  }

  function refreshItemCount(){
    const wheelCount = expandItems(items).length;
    itemCountEl.textContent = items.length + ' pilihan' +
      (wheelCount > items.length ? ' • diulang jadi ' + wheelCount + ' potong biar roda nggak terlalu kosong' : '') +
      ' • tambah sebanyak yang kamu mau';
    warnMsg.textContent = items.length < 2 ? 'Minimal 2 pilihan buat mulai muter.' : '';
  }

  function addItem(){
    const input = document.getElementById('newItem');
    const val = input.value.trim();
    if (!val) return;
    items.push(val);
    input.value = '';
    renderItems();
    drawWheel();
  }
  document.getElementById('addBtn').onclick = addItem;
  document.getElementById('newItem').addEventListener('keydown', e => {
    if (e.key === 'Enter') addItem();
  });
  document.getElementById('clearBtn').onclick = () => {
    items = [];
    renderItems();
    drawWheel();
  };

  editBtn.onclick = () => editOverlay.classList.add('open');
  closeEdit.onclick = () => editOverlay.classList.remove('open');
  editOverlay.addEventListener('click', e => { if (e.target === editOverlay) editOverlay.classList.remove('open'); });

  closeResult.onclick = () => resultOverlay.classList.remove('open');
  resultOverlay.addEventListener('click', e => { if (e.target === resultOverlay) resultOverlay.classList.remove('open'); });

  function expandItems(list){
    const n = list.length;
    if (n === 0) return [];
    const k = Math.max(1, Math.ceil(5 / n));
    const out = [];
    for (let r = 0; r < k; r++) out.push(...list);
    return out;
  }

  function wrapText(ctx, text, maxWidth){
    const words = text.split(' ');
    const lines = [];
    let line = '';
    words.forEach(w => {
      const test = line ? line + ' ' + w : w;
      if (ctx.measureText(test).width > maxWidth && line){
        lines.push(line);
        line = w;
      } else {
        line = test;
      }
    });
    if (line) lines.push(line);
    return lines.slice(0, 2);
  }

  function drawWheel(){
    const W = canvas.width, H = canvas.height;
    const cx = W/2, cy = H/2, R = W/2 - 8;
    ctx.clearRect(0,0,W,H);

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rotation * Math.PI/180);

    const originalN = items.length;
    const wheelItems = expandItems(items);
    const n = wheelItems.length;
    if (n === 0){
      ctx.beginPath();
      ctx.arc(0,0,R,0,Math.PI*2);
      ctx.fillStyle = '#2c2166';
      ctx.fill();
      ctx.restore();
      ctx.fillStyle = '#a79cd9';
      ctx.font = '600 20px Inter, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('Tambahkan pilihan', cx, cy);
      return;
    }

    const seg = (Math.PI*2) / n;
    const fontSize = n > 14 ? 13 : n > 8 ? 16 : 20;

    for (let i=0; i<n; i++){
      const start = -Math.PI/2 + i*seg;
      const end = start + seg;
      const colorIdx = i % originalN;
      ctx.beginPath();
      ctx.moveTo(0,0);
      ctx.arc(0,0,R,start,end);
      ctx.closePath();
      ctx.fillStyle = COLORS[colorIdx % COLORS.length];
      ctx.fill();
      ctx.strokeStyle = 'rgba(21,15,48,0.5)';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.save();
      const mid = start + seg/2;
      ctx.rotate(mid);
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#150f30';
      ctx.font = '700 ' + fontSize + 'px "Baloo 2", sans-serif';
      const lines = wrapText(ctx, wheelItems[i] || '', R*0.62);
      const lh = fontSize * 1.15;
      const startY = -((lines.length-1)*lh)/2;
      lines.forEach((ln, li) => {
        ctx.fillText(ln, R - 18, startY + li*lh);
      });
      ctx.restore();
    }
    ctx.restore();
  }

  function spin(){
    if (spinning) return;
    const n = items.length;
    if (n < 2){
      editOverlay.classList.add('open');
      warnMsg.textContent = 'Minimal 2 pilihan buat mulai muter.';
      return;
    }
    spinning = true;
    spinBtn.disabled = true;

    const wheelItems = expandItems(items);
    const wheelN = wheelItems.length;
    const segAngle = 360/wheelN;
    const targetIndex = Math.floor(Math.random()*wheelN);
    const randomOffset = segAngle*0.15 + Math.random()*segAngle*0.7;
    const targetFromTop = targetIndex*segAngle + randomOffset;
    const desiredMod = ((360 - targetFromTop) % 360 + 360) % 360;
    const currentMod = ((rotation % 360) + 360) % 360;
    const delta = ((desiredMod - currentMod) % 360 + 360) % 360;
    const spins = 6 + Math.floor(Math.random()*3);
    const totalDelta = spins*360 + delta;

    const startRotation = rotation;
    const endRotation = rotation + totalDelta;
    const duration = 4200;
    const startTime = performance.now();

    function easeOutCubic(t){ return 1 - Math.pow(1-t, 3); }

    function frame(now){
      const t = Math.min(1, (now - startTime) / duration);
      const eased = easeOutCubic(t);
      rotation = startRotation + totalDelta*eased;
      drawWheel();
      if (t < 1){
        requestAnimationFrame(frame);
      } else {
        rotation = endRotation;
        spinning = false;
        spinBtn.disabled = false;
        resultValue.textContent = wheelItems[targetIndex];
        resultOverlay.classList.add('open');
      }
    }
    requestAnimationFrame(frame);
  }
  spinBtn.onclick = spin;

  renderTemplates();
  renderItems();
  sizeWheelHolder();
  drawWheel();
  window.addEventListener('resize', () => { sizeWheelHolder(); drawWheel(); });
  window.addEventListener('orientationchange', () => { setTimeout(() => { sizeWheelHolder(); drawWheel(); }, 60); });
  if (document.fonts && document.fonts.ready){
    document.fonts.ready.then(() => { sizeWheelHolder(); drawWheel(); });
  }
</script>
</body>
</html>
