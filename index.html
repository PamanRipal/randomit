<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roda Keputusan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #150f30;
    --bg-2: #1e1650;
    --surface: #241b57;
    --surface-2: #2c2166;
    --line: #3b2f80;
    --text: #f3efff;
    --muted: #a79cd9;
    --coral: #ff6b5b;
    --marigold: #ffb84d;
    --teal: #2ec4b6;
    --violet: #8b7bff;
    --pink: #ff5d9e;
    --lime: #c6e356;
    --gold: #ffd166;
    color-scheme: dark;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{ box-sizing: inherit; }
  html{ scroll-padding-top: env(safe-area-inset-top, 0px); }
  html,body{ height:100%; }
  body{
    margin:0;
    background:
      radial-gradient(60vw 40vw at 85% -5%, rgba(255,107,91,0.18), transparent 60%),
      radial-gradient(50vw 40vw at 0% 100%, rgba(46,196,182,0.14), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100%;
    -webkit-font-smoothing: antialiased;
  }
  .wrap{
    max-width: 1080px;
    margin: 0 auto;
    padding: 36px 20px 60px;
  }
  header{
    text-align:center;
    margin-bottom: 30px;
  }
  .eyebrow{
    font-family:'Baloo 2', sans-serif;
    font-weight:600;
    color: var(--marigold);
    letter-spacing: .02em;
    font-size: 14px;
    margin-bottom: 6px;
  }
  h1{
    font-family:'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: clamp(32px, 5vw, 48px);
    margin: 0 0 8px;
    line-height: 1.05;
  }
  header p{
    color: var(--muted);
    font-size: 16px;
    margin: 0;
    max-width: 520px;
    margin-inline: auto;
  }
  .layout{
    display: grid;
    grid-template-columns: minmax(280px, 440px) 1fr;
    gap: 28px;
    align-items: start;
  }
  @media (max-width: 820px){
    .layout{ grid-template-columns: 1fr; }
  }
  .wheel-card{
    background: linear-gradient(180deg, var(--surface), var(--bg-2));
    border: 1px solid var(--line);
    border-radius: 28px;
    padding: 28px 20px 26px;
    display:flex;
    flex-direction:column;
    align-items:center;
    position: sticky;
    top: 20px;
  }
  .wheel-holder{
    position: relative;
    width: min(78vw, 380px);
    aspect-ratio: 1/1;
    margin-bottom: 22px;
  }
  canvas{
    width:100%;
    height:100%;
    display:block;
    filter: drop-shadow(0 18px 30px rgba(0,0,0,0.45));
  }
  .pointer{
    position:absolute;
    top: -6px;
    left: 50%;
    transform: translateX(-50%);
    width: 34px;
    height: 40px;
    z-index: 3;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
  }
  .hub{
    position:absolute;
    top:50%; left:50%;
    width: 58px; height:58px;
    transform: translate(-50%,-50%);
    background: radial-gradient(circle at 35% 30%, #fff, var(--gold) 55%, #c98f1c 100%);
    border-radius: 50%;
    border: 3px solid var(--bg);
    z-index: 2;
  }
  .spin-btn{
    font-family:'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 19px;
    color: #1a1130;
    background: linear-gradient(180deg, var(--gold), var(--marigold));
    border: none;
    border-radius: 999px;
    padding: 14px 46px;
    cursor: pointer;
    box-shadow: 0 8px 0 #b5710f, 0 14px 22px rgba(0,0,0,0.35);
    transition: transform .08s ease;
    letter-spacing: .01em;
  }
  .spin-btn:active{ transform: translateY(4px); box-shadow: 0 4px 0 #b5710f, 0 8px 14px rgba(0,0,0,0.3); }
  .spin-btn:disabled{ opacity: .55; cursor: default; box-shadow: 0 8px 0 #6c5a2a; }
  .result{
    margin-top: 18px;
    min-height: 54px;
    text-align:center;
  }
  .result .label{
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 4px;
  }
  .result .value{
    font-family:'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 22px;
    color: var(--lime);
    opacity: 0;
    transform: translateY(6px);
    transition: opacity .35s ease, transform .35s ease;
  }
  .result .value.show{ opacity:1; transform: translateY(0); }

  .panel{
    background: linear-gradient(180deg, var(--surface), var(--bg-2));
    border: 1px solid var(--line);
    border-radius: 28px;
    padding: 26px 24px 28px;
  }
  .panel h2{
    font-family:'Baloo 2', sans-serif;
    font-size: 18px;
    margin: 0 0 4px;
  }
  .panel .sub{
    color: var(--muted);
    font-size: 14px;
    margin: 0 0 16px;
  }
  .templates{
    display:flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 24px;
  }
  .chip{
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size: 14px;
    color: var(--text);
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 9px 16px;
    cursor:pointer;
  }
  .chip.active{
    background: var(--pink);
    border-color: var(--pink);
    color: #1a1130;
  }
  .chip:hover:not(.active){ border-color: var(--pink); }

  .items{
    display:flex;
    flex-direction:column;
    gap: 8px;
    margin-bottom: 14px;
    max-height: 360px;
    overflow-y: auto;
    padding-right: 4px;
  }
  .item-row{
    display:flex;
    align-items:center;
    gap: 10px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 4px 6px 4px 14px;
  }
  .item-row .dot{
    width: 10px; height:10px; border-radius:50%; flex:none;
  }
  .item-row input{
    flex:1;
    background: transparent;
    border: none;
    color: var(--text);
    font-size: 15px;
    font-family: 'Inter', sans-serif;
    padding: 8px 0;
    min-width: 0;
  }
  .item-row input:focus{ outline: none; }
  .item-row button{
    flex:none;
    width: 30px; height:30px;
    border-radius: 8px;
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 17px;
    cursor:pointer;
    line-height:1;
  }
  .item-row button:hover{ background: rgba(255,93,158,0.18); color: var(--pink); }

  .add-row{
    display:flex;
    gap: 8px;
    margin-top: 4px;
  }
  .add-row input{
    flex:1;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 12px;
    color: var(--text);
    font-size: 15px;
    padding: 11px 14px;
    font-family:'Inter', sans-serif;
  }
  .add-row input::placeholder{ color: var(--muted); }
  .add-row input:focus{ outline: 2px solid var(--pink); outline-offset: 1px; }
  .add-row button{
    flex:none;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    background: var(--teal);
    color:#0d2a27;
    border:none;
    border-radius: 12px;
    padding: 0 20px;
    cursor:pointer;
    font-size: 15px;
  }
  .foot-actions{
    display:flex;
    justify-content: space-between;
    align-items:center;
    margin-top: 16px;
    font-size: 13px;
    color: var(--muted);
  }
  .foot-actions button{
    background:none;
    border:none;
    color: var(--muted);
    text-decoration: underline;
    cursor:pointer;
    font-size: 13px;
    font-family:'Inter', sans-serif;
    padding: 0;
  }
  .foot-actions button:hover{ color: var(--pink); }

  @media (prefers-reduced-motion: reduce){
    .result .value{ transition:none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Roda Keputusan</div>
    <h1>Putar, biar takdir yang milih</h1>
    <p>Masukin pilihan kamu, putar rodanya, selesai. Nggak usah debat lagi.</p>
  </header>

  <div class="layout">
    <div class="wheel-card">
      <div class="wheel-holder">
        <svg class="pointer" viewBox="0 0 34 40" xmlns="http://www.w3.org/2000/svg">
          <path d="M17 40 L2 8 Q17 -6 32 8 Z" fill="#ff5d9e" stroke="#150f30" stroke-width="2"/>
        </svg>
        <canvas id="wheel" width="640" height="640"></canvas>
        <div class="hub"></div>
      </div>
      <button class="spin-btn" id="spinBtn">Putar!</button>
      <div class="result">
        <div class="label" id="resultLabel"></div>
        <div class="value" id="resultValue"></div>
      </div>
    </div>

    <div class="panel">
      <h2>Pilih template</h2>
      <p class="sub">Klik salah satu, lalu edit bebas isi listnya di bawah.</p>
      <div class="templates" id="templates"></div>

      <h2>Isi roulette</h2>
      <p class="sub" id="itemCount"></p>
      <div class="items" id="items"></div>
      <div class="add-row">
        <input type="text" id="newItem" placeholder="Tambah pilihan baru…" maxlength="60">
        <button id="addBtn">Tambah</button>
      </div>
      <div class="foot-actions">
        <span id="warnMsg"></span>
        <button id="clearBtn">Hapus semua</button>
      </div>
    </div>
  </div>
</div>

<script>
  const COLORS = ['#ff6b5b','#ffb84d','#2ec4b6','#8b7bff','#ff5d9e','#c6e356'];

  const TEMPLATES = {
    topik: {
      label: 'Topik obrolan',
      items: ['Cerita paling lucu minggu ini','Rencana liburan impian','Film/series yang lagi ditonton','Gosip terbaru','Rencana weekend','Hal yang bikin bersyukur hari ini']
    },
    cerita: {
      label: 'Cerita',
      items: ['Cerita seram','Cerita lucu','Cerita film / buku','Cerita momen berkesan','Cerita cinta']
    },
    kenalan: {
      label: 'Kenalan',
      items: ['Hobi','Impian','Lagu favorit','Makanan favorit','Love Language']
    },
    kenalan2: {
      label: 'Kenalan 2',
      items: ['Apa yang membuatmu marah?','Apa yang membuatmu sedih?','Apa yang membuatmu bahagia?','Apa yang paling kamu takutin?','Apa yang bikin kamu kagum?']
    },
    tod: {
      label: 'Truth or Dare',
      items: ['Truth','Dare']
    },
    truth: {
      label: 'Truth',
      items: ['Rahasia yang belum pernah kamu certain ke siapa pun?','Siapa crush pertamamu?','Momen paling memalukan dalam hidupmu?','Kebohongan terbesar yang pernah kamu buat?','Hal yang paling kamu sesali?','Chat siapa yang paling sering kamu stalking?']
    },
    dare: {
      label: 'Dare',
      items: ['Nyanyi 1 lagu random selama 30 detik','Telepon kontak teratas & bilang "aku kangen kamu"','Post story absurd selama 1 menit','Tiru gaya bicara orang di sebelahmu','Push up 15x','Kirim voice note nyanyi ke grup keluarga']
    },
    abcd: {
      label: 'A / B / C / D',
      items: ['A','B','C','D']
    }
  };

  let items = [...TEMPLATES.topik.items];
  let activeTemplate = 'topik';
  let rotation = 0;
  let spinning = false;

  const canvas = document.getElementById('wheel');
  const ctx = canvas.getContext('2d');
  const templatesEl = document.getElementById('templates');
  const itemsEl = document.getElementById('items');
  const itemCountEl = document.getElementById('itemCount');
  const warnMsg = document.getElementById('warnMsg');
  const resultLabel = document.getElementById('resultLabel');
  const resultValue = document.getElementById('resultValue');
  const spinBtn = document.getElementById('spinBtn');

  function renderTemplates(){
    templatesEl.innerHTML = '';
    Object.entries(TEMPLATES).forEach(([key, tpl]) => {
      const btn = document.createElement('button');
      btn.className = 'chip' + (key === activeTemplate ? ' active' : '');
      btn.textContent = tpl.label;
      btn.onclick = () => {
        activeTemplate = key;
        items = [...tpl.items];
        renderTemplates();
        renderItems();
        drawWheel();
        clearResult();
      };
      templatesEl.appendChild(btn);
    });
  }

  function renderItems(){
    itemsEl.innerHTML = '';
    items.forEach((val, i) => {
      const row = document.createElement('div');
      row.className = 'item-row';

      const dot = document.createElement('span');
      dot.className = 'dot';
      dot.style.background = COLORS[i % COLORS.length];

      const input = document.createElement('input');
      input.type = 'text';
      input.value = val;
      input.maxLength = 60;
      input.oninput = () => { items[i] = input.value; drawWheel(); };

      const removeBtn = document.createElement('button');
      removeBtn.textContent = '×';
      removeBtn.title = 'Hapus';
      removeBtn.onclick = () => {
        items.splice(i, 1);
        renderItems();
        drawWheel();
      };

      row.appendChild(dot);
      row.appendChild(input);
      row.appendChild(removeBtn);
      itemsEl.appendChild(row);
    });
    const wheelCount = expandItems(items).length;
    itemCountEl.textContent = items.length + ' pilihan' +
      (wheelCount > items.length ? ' • diulang jadi ' + wheelCount + ' potong biar roda nggak terlalu kosong' : '') +
      ' • tambah sebanyak yang kamu mau';
    warnMsg.textContent = items.length < 2 ? 'Minimal 2 pilihan buat mulai muter.' : '';
  }

  function addItem(){
    const input = document.getElementById('newItem');
    const val = input.value.trim();
    if (!val) return;
    items.push(val);
    input.value = '';
    renderItems();
    drawWheel();
  }
  document.getElementById('addBtn').onclick = addItem;
  document.getElementById('newItem').addEventListener('keydown', e => {
    if (e.key === 'Enter') addItem();
  });
  document.getElementById('clearBtn').onclick = () => {
    items = [];
    renderItems();
    drawWheel();
    clearResult();
  };

  function clearResult(){
    resultLabel.textContent = '';
    resultValue.textContent = '';
    resultValue.classList.remove('show');
  }

  function expandItems(list){
    const n = list.length;
    if (n === 0) return [];
    const k = Math.max(1, Math.ceil(5 / n));
    const out = [];
    for (let r = 0; r < k; r++) out.push(...list);
    return out;
  }

  function wrapText(ctx, text, maxWidth){
    const words = text.split(' ');
    const lines = [];
    let line = '';
    words.forEach(w => {
      const test = line ? line + ' ' + w : w;
      if (ctx.measureText(test).width > maxWidth && line){
        lines.push(line);
        line = w;
      } else {
        line = test;
      }
    });
    if (line) lines.push(line);
    return lines.slice(0, 2);
  }

  function drawWheel(){
    const W = canvas.width, H = canvas.height;
    const cx = W/2, cy = H/2, R = W/2 - 8;
    ctx.clearRect(0,0,W,H);

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rotation * Math.PI/180);

    const originalN = items.length;
    const wheelItems = expandItems(items);
    const n = wheelItems.length;
    if (n === 0){
      ctx.beginPath();
      ctx.arc(0,0,R,0,Math.PI*2);
      ctx.fillStyle = '#2c2166';
      ctx.fill();
      ctx.restore();
      ctx.fillStyle = '#a79cd9';
      ctx.font = '600 20px Inter, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('Tambahkan pilihan', cx, cy);
      return;
    }

    const seg = (Math.PI*2) / n;
    const fontSize = n > 14 ? 13 : n > 8 ? 16 : 20;

    for (let i=0; i<n; i++){
      const start = -Math.PI/2 + i*seg;
      const end = start + seg;
      const colorIdx = i % originalN;
      ctx.beginPath();
      ctx.moveTo(0,0);
      ctx.arc(0,0,R,start,end);
      ctx.closePath();
      ctx.fillStyle = COLORS[colorIdx % COLORS.length];
      ctx.fill();
      ctx.strokeStyle = 'rgba(21,15,48,0.5)';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.save();
      const mid = start + seg/2;
      ctx.rotate(mid);
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#150f30';
      ctx.font = '700 ' + fontSize + 'px "Baloo 2", sans-serif';
      const lines = wrapText(ctx, wheelItems[i] || '', R*0.62);
      const lh = fontSize * 1.15;
      const startY = -((lines.length-1)*lh)/2;
      lines.forEach((ln, li) => {
        ctx.fillText(ln, R - 18, startY + li*lh);
      });
      ctx.restore();
    }
    ctx.restore();
  }

  function spin(){
    if (spinning) return;
    const n = items.length;
    if (n < 2){
      warnMsg.textContent = 'Minimal 2 pilihan buat mulai muter.';
      return;
    }
    spinning = true;
    spinBtn.disabled = true;
    clearResult();

    const wheelItems = expandItems(items);
    const wheelN = wheelItems.length;
    const segAngle = 360/wheelN;
    const targetIndex = Math.floor(Math.random()*wheelN);
    const randomOffset = segAngle*0.15 + Math.random()*segAngle*0.7;
    const targetFromTop = targetIndex*segAngle + randomOffset;
    const desiredMod = ((360 - targetFromTop) % 360 + 360) % 360;
    const currentMod = ((rotation % 360) + 360) % 360;
    const delta = ((desiredMod - currentMod) % 360 + 360) % 360;
    const spins = 6 + Math.floor(Math.random()*3);
    const totalDelta = spins*360 + delta;

    const startRotation = rotation;
    const endRotation = rotation + totalDelta;
    const duration = 4200;
    const startTime = performance.now();

    function easeOutCubic(t){ return 1 - Math.pow(1-t, 3); }

    function frame(now){
      const t = Math.min(1, (now - startTime) / duration);
      const eased = easeOutCubic(t);
      rotation = startRotation + totalDelta*eased;
      drawWheel();
      if (t < 1){
        requestAnimationFrame(frame);
      } else {
        rotation = endRotation;
        spinning = false;
        spinBtn.disabled = false;
        resultLabel.textContent = 'Hasilnya…';
        resultValue.textContent = wheelItems[targetIndex];
        requestAnimationFrame(() => resultValue.classList.add('show'));
      }
    }
    requestAnimationFrame(frame);
  }
  spinBtn.onclick = spin;

  renderTemplates();
  renderItems();
  drawWheel();
</script>
</body>
</html>
